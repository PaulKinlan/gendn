name: Fetch ChromeStatus Data

on:
  push:
    paths:
      - ".github/workflows/fetch-data.yml"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create data directory
        run: mkdir -p _data

      - name: Fetch channels
        run: |
          echo "Fetching channels..."
          # Transfer bounds mirror lib/chromestatus.ts:
          # UPSTREAM_TIMEOUT_MS = 15_000 (10s connect, 30s transfer ceiling in CI)
          # UPSTREAM_MAX_BYTES = 8388608 (8 MiB response size ceiling)
          HTTP=$(curl -s --fail --show-error --connect-timeout 10 --max-time 30 --max-filesize 8388608 -w '%{http_code}' -o /tmp/channels_raw.txt 'https://chromestatus.com/api/v0/channels' -H 'accept: application/json')
          echo "HTTP status: $HTTP"
          if [ "$HTTP" = "200" ]; then
            tail -c +6 /tmp/channels_raw.txt > _data/channels.json
            python3 -c "import json; d = json.load(open('_data/channels.json')); assert isinstance(d, dict) and 'stable' in d, 'Invalid channels payload'"
            echo "OK: $(wc -c < _data/channels.json) bytes"
          else
            cat /tmp/channels_raw.txt >&2
            echo "Failed to fetch channels: HTTP $HTTP" >&2
            exit 1
          fi

      - name: Fetch features milestone 147
        run: |
          HTTP=$(curl -s --fail --show-error --connect-timeout 10 --max-time 30 --max-filesize 8388608 -w '%{http_code}' -o /tmp/f147_raw.txt 'https://chromestatus.com/api/v0/features?milestone=147' -H 'accept: application/json')
          if [ "$HTTP" = "200" ]; then
            tail -c +6 /tmp/f147_raw.txt > _data/features-147.json
            python3 -c "import json; d = json.load(open('_data/features-147.json')); assert isinstance(d, dict) and 'features_by_type' in d, 'Invalid features payload'"
            echo "147: OK ($(wc -c < _data/features-147.json) bytes)"
          else
            echo "147: failed with HTTP $HTTP" >&2
            exit 1
          fi

      - name: Fetch features milestone 148
        run: |
          HTTP=$(curl -s --fail --show-error --connect-timeout 10 --max-time 30 --max-filesize 8388608 -w '%{http_code}' -o /tmp/f148_raw.txt 'https://chromestatus.com/api/v0/features?milestone=148' -H 'accept: application/json')
          if [ "$HTTP" = "200" ]; then
            tail -c +6 /tmp/f148_raw.txt > _data/features-148.json
            python3 -c "import json; d = json.load(open('_data/features-148.json')); assert isinstance(d, dict) and 'features_by_type' in d, 'Invalid features payload'"
            echo "148: OK ($(wc -c < _data/features-148.json) bytes)"
          else
            echo "148: failed with HTTP $HTTP" >&2
            exit 1
          fi

      - name: Fetch features milestone 149
        run: |
          HTTP=$(curl -s --fail --show-error --connect-timeout 10 --max-time 30 --max-filesize 8388608 -w '%{http_code}' -o /tmp/f149_raw.txt 'https://chromestatus.com/api/v0/features?milestone=149' -H 'accept: application/json')
          if [ "$HTTP" = "200" ]; then
            tail -c +6 /tmp/f149_raw.txt > _data/features-149.json
            python3 -c "import json; d = json.load(open('_data/features-149.json')); assert isinstance(d, dict) and 'features_by_type' in d, 'Invalid features payload'"
            echo "149: OK ($(wc -c < _data/features-149.json) bytes)"
          else
            echo "149: failed with HTTP $HTTP" >&2
            exit 1
          fi

      - name: Fetch features milestone 150
        run: |
          HTTP=$(curl -s --fail --show-error --connect-timeout 10 --max-time 30 --max-filesize 8388608 -w '%{http_code}' -o /tmp/f150_raw.txt 'https://chromestatus.com/api/v0/features?milestone=150' -H 'accept: application/json')
          if [ "$HTTP" = "200" ]; then
            tail -c +6 /tmp/f150_raw.txt > _data/features-150.json
            python3 -c "import json; d = json.load(open('_data/features-150.json')); assert isinstance(d, dict) and 'features_by_type' in d, 'Invalid features payload'"
            echo "150: OK ($(wc -c < _data/features-150.json) bytes)"
          else
            echo "150: failed with HTTP $HTTP" >&2
            exit 1
          fi

      - name: Fetch features milestone 151
        run: |
          HTTP=$(curl -s --fail --show-error --connect-timeout 10 --max-time 30 --max-filesize 8388608 -w '%{http_code}' -o /tmp/f151_raw.txt 'https://chromestatus.com/api/v0/features?milestone=151' -H 'accept: application/json')
          if [ "$HTTP" = "200" ]; then
            tail -c +6 /tmp/f151_raw.txt > _data/features-151.json
            python3 -c "import json; d = json.load(open('_data/features-151.json')); assert isinstance(d, dict) and 'features_by_type' in d, 'Invalid features payload'"
            echo "151: OK ($(wc -c < _data/features-151.json) bytes)"
          else
            echo "151: failed with HTTP $HTTP" >&2
            exit 1
          fi

      - name: Show summary
        run: |
          for f in _data/*.json; do
            COUNT=$(python3 -c "import json,sys; d=json.load(open('$f')); print(sum(len(v) for v in d.get('features_by_type',{}).values()))")
            echo "$f: $COUNT features"
          done

      - name: Commit data
        run: |
          git config user.email 'paul.kinlan@gmail.com'
          git config user.name 'Paul Kinlan'
          git add _data/
          git diff --cached --quiet && echo 'No changes to commit' && exit 0
          git commit -m 'chore: cache chromestatus API data'
          git pull --rebase origin main
          git push origin main
