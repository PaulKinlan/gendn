name: Fetch ChromeStatus Data

on:
  push:
    paths:
      - ".github/workflows/fetch-data.yml"
  # Weekly refresh, Sunday 05:13 UTC: about 90 minutes before the Sunday weekly-hardening
  # routine (06:43 Europe/London), so the snapshot in _data/ is current when it runs.
  schedule:
    - cron: "13 5 * * 0"
  workflow_dispatch:

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create data directory
        run: mkdir -p _data

      - name: Fetch channels
        run: |
          echo "Fetching channels..."
          # Transfer bounds are set for CI; they are NOT a copy of lib/chromestatus.ts.
          # The in-process budget is UPSTREAM_TIMEOUT_MS = 15_000, but CI deliberately
          # uses a LONGER ceiling (--connect-timeout 10 --max-time 30) so a degraded upstream
          # response that arrives within 30s is judged by the payload checks below rather than
          # being cut off early by a shorter timeout.
          # Do NOT lower --max-time 30 to 15s to 'match' the library value.
          # UPSTREAM_MAX_BYTES = 8388608 does mirror the 8 MiB response size ceiling exactly.
          HTTP=$(curl -s --fail --show-error --connect-timeout 10 --max-time 30 --max-filesize 8388608 -w '%{http_code}' -o /tmp/channels_raw.txt 'https://chromestatus.com/api/v0/channels' -H 'accept: application/json')
          echo "HTTP status: $HTTP"
          if [ "$HTTP" = "200" ]; then
            tail -c +6 /tmp/channels_raw.txt > /tmp/channels.json
            python3 -c "import json; d = json.load(open('/tmp/channels.json')); assert isinstance(d, dict) and 'stable' in d, 'Invalid channels payload'"
            mv /tmp/channels.json _data/channels.json
            echo "OK: $(wc -c < _data/channels.json) bytes"
          else
            cat /tmp/channels_raw.txt >&2
            echo "Failed to fetch channels: HTTP $HTTP" >&2
            exit 1
          fi

      # Milestones come from the channels payload (stable-1 through dev) instead of a hardcoded
      # list, which had frozen at 147-151 while Chrome moved on. Older files stay as they are.
      - name: Fetch features for current milestones
        run: |
          STABLE=$(python3 -c "import json; print(int(json.load(open('_data/channels.json'))['stable']['mstone']))")
          TOP=$(python3 -c "import json; d=json.load(open('_data/channels.json')); print(max(int(v['mstone']) for v in d.values() if isinstance(v, dict) and 'mstone' in v))")
          echo "Milestones $((STABLE - 1))..$TOP"
          for N in $(seq $((STABLE - 1)) "$TOP"); do
            # Same transfer bounds and payload check as the channels step above.
            HTTP=$(curl -s --fail --show-error --connect-timeout 10 --max-time 30 --max-filesize 8388608 -w '%{http_code}' -o "/tmp/f${N}_raw.txt" "https://chromestatus.com/api/v0/features?milestone=${N}" -H 'accept: application/json')
            if [ "$HTTP" = "200" ]; then
              tail -c +6 "/tmp/f${N}_raw.txt" > "/tmp/features-${N}.json"
              python3 -c "import json,sys; d = json.load(open(sys.argv[1])); assert isinstance(d, dict) and 'features_by_type' in d, 'Invalid features payload'" "/tmp/features-${N}.json"
              mv "/tmp/features-${N}.json" "_data/features-${N}.json"
              echo "${N}: OK ($(wc -c < "_data/features-${N}.json") bytes)"
            else
              echo "${N}: failed with HTTP $HTTP" >&2
              exit 1
            fi
          done

      - name: Show summary
        run: |
          for f in _data/*.json; do
            COUNT=$(python3 -c "import json,sys; d=json.load(open('$f')); print(sum(len(v) for v in d.get('features_by_type',{}).values()))")
            echo "$f: $COUNT features"
          done

      - name: Commit data
        run: |
          git config user.email 'paul.kinlan@gmail.com'
          git config user.name 'Paul Kinlan'
          git add _data/
          git diff --cached --quiet && echo 'No changes to commit' && exit 0
          git commit -m 'chore: cache chromestatus API data'
          git pull --rebase origin main
          git push origin main
