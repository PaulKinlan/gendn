name: Doc Tests & Drift Report

on:
  schedule:
    # Weekly on Sundays at 06:30 UTC (report-only; non-blocking on PRs).
    - cron: "30 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-drift:
    name: Doc snippet verification & staleness/drift summary
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Tier 1 offline doc snippet & contract-symbol tests
        continue-on-error: true
        run: |
          {
            echo "## Tier 1: Doc Snippet & Contract-Symbol Verification"
            echo ""
            echo '```text'
            node scripts/doc-tests.mjs --all
            echo '```'
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Tier 2 staleness, ChromeStatus drift & live MDN graduation report
        continue-on-error: true
        run: node scripts/doc-drift.mjs --markdown --live-mdn >> "$GITHUB_STEP_SUMMARY"
