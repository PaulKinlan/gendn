name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check + format check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Type check
        run: deno check server.ts

      - name: Format check
        run: deno fmt --check

  routes:
    name: Route regression gate (durable demo contract)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need origin/main history to derive the published baseline

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Ensure origin/main is available for the baseline
        run: git fetch --no-tags origin main

      - name: Route regression gate
        run: deno task check-routes

  conformance:
    name: Conformance + coverage gate (critique/immutable-conformance lifecycle)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need origin/main to diff assertions for the immutability check

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Ensure origin/main is available for the baseline
        run: git fetch --no-tags origin main

      - name: Validate lifecycle artifacts (schema + suiteHash)
        run: deno task validate-artifacts

      - name: Conformance + coverage gate
        run: deno task check-conformance

      # Browser-backed visibility checks are excluded from test-fixtures; run them explicitly
      # so a hidden reference contract cannot pass every automatic gate.
      - name: Reference-contract browser regression suite
        run: deno task test-reference-contract

      # This step validates the CHECKER against synthetic logs; it is not evidence about the runner,
      # whose real output is only read at the landing gate (`deno task check-verdict-emission <log>`).
      - name: Verdict-emission checker self-test (validates the checker, not the runner)
        run: deno task test-verdict-emission

      # Every scripts/*.test.mjs fixture is file-discovered with narrow per-file permission
      # metadata; browser-backed files are listed as exclusions (the reference suite runs above).
      # Adding a fixture file enrolls it without touching deno.json.
      - name: Fixture suite (all discovered fixture files)
        run: deno task test-fixtures
