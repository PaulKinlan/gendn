name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type check + format check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run fmt:check

  routes:
    name: Route regression gate (durable demo contract)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need origin/main history to derive the published baseline

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure origin/main is available for the baseline
        run: git fetch --no-tags origin main

      - name: Route regression gate
        run: npm run check-routes

  conformance:
    name: Conformance + coverage gate (critique/immutable-conformance lifecycle)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need origin/main to diff assertions for the immutability check

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure origin/main is available for the baseline
        run: git fetch --no-tags origin main

      - name: Validate lifecycle artifacts (schema + suiteHash)
        run: npm run validate-artifacts

      - name: Conformance + coverage gate
        run: npm run check-conformance

      # Browser-backed visibility checks are excluded from test-fixtures; run them explicitly
      # so a hidden reference contract cannot pass every automatic gate.
      - name: Reference-contract browser regression suite
        run: npm run test-reference-contract

      # The CSS-drift real-browser suite is excluded from the deterministic fixture tier so an
      # unrelated landing does not pay ~29s of Chrome for it (gendn-xe6f); the fast tier selects it
      # by changed path. CI is the BACKSTOP that makes that skip safe: it runs unconditionally here,
      # so the browser half of the CSS coverage is never silently discarded.
      - name: CSS-drift browser regression suite (record/no-drift/mutation, mobile + desktop)
        run: npm run test-css-drift-browser

      # This step validates the CHECKER against synthetic logs; it is not evidence about the runner,
      # whose real output is only read at the landing gate (`npm run check-verdict-emission -- <log>`).
      - name: Verdict-emission checker self-test (validates the checker, not the runner)
        run: npm run test-verdict-emission

      # Every scripts/*.test.mjs fixture is file-discovered and run with node; browser-backed
      # files are listed as exclusions (the reference suite runs above).
      # Adding a fixture file enrolls it without touching package.json.
      - name: Fixture suite (all discovered fixture files)
        run: npm run test-fixtures
