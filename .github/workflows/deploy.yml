name: Deploy to Cloudflare Workers

# Deploys the site (worker.ts + the dist/site static assets) with wrangler on every push to main.
# Deno Deploy shuts down in April 2027; this replaces it.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the "Edit Cloudflare Workers"
# template) and CLOUDFLARE_ACCOUNT_ID. Until both exist the job explains what is missing and
# exits successfully, so main stays green while the move is being set up.
#
# auto-merge-weekly.yml merges with GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do not start
# workflows, so it dispatches this workflow explicitly after each merge (workflow_dispatch is the
# documented exception).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "### Not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy to Cloudflare Workers." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Cloudflare deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: |
          node --version
          npm ci --no-audit --no-fund

      # wrangler runs scripts/build-worker-assets.mjs (wrangler.jsonc "build") before uploading.
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler deploy
