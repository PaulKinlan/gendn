name: Auto-merge weekly hardening PR

# The Sunday weekly-hardening routine opens one PR per run. Left unmerged, the next run starts
# from a stale main and redoes the same pages, so the PRs conflict with each other (PRs #14-#20
# piled up this way and had to be combined by hand in #21). This workflow merges the routine's PR
# as soon as CI is green on it, so each run builds on the last.
#
# It merges ONLY when every one of these holds; otherwise it leaves the PR for a person and says why:
#   - the CI workflow concluded success on the PR's current head commit (all three gate jobs);
#   - every other check run on that commit is success/neutral/skipped;
#   - same-repo PR into main from a `claude/` branch, opened by the repo owner, not a draft;
#   - the title starts with "Weekly hardening", or the PR carries the `auto-merge` label;
#   - every changed file is routine-owned content (v<N>/ pages and the shared ledgers listed in
#     ALLOWED below). A PR that touches server.ts, lib/, public/, scripts/, CI, deno.json or the
#     docs (CLAUDE.md invariant #8) always waits for a human review.
#
# Security: workflow_run executes this file from the default branch with a write token. It never
# checks out or runs PR code; it reads PR metadata through the API and calls `gh pr merge` pinned
# to the verified head SHA, so a commit pushed after CI ran cannot ride along.
#
# Note: a merge made with GITHUB_TOKEN does not trigger push workflows on main (CI or deploy). The
# same gates already passed on the PR head, and the merge step dispatches deploy.yml explicitly
# (workflow_dispatch is the documented exception to that rule).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to evaluate now"
        required: true

concurrency:
  group: auto-merge-weekly
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'claude/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      DISPATCH_PR: ${{ github.event.inputs.pr }}
    steps:
      - name: Evaluate and merge
        run: |
          set -eu
          MARKER='<!-- auto-merge-weekly -->'
          skip() { echo "SKIP: $1"; echo "### Not auto-merged" >> "$GITHUB_STEP_SUMMARY"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          # Leave one explanatory comment per PR (not one per CI run).
          explain() {
            if ! gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
              printf '%s\nThis PR was not merged automatically: %s\n\nIt needs a human review and merge.\n\n---\n_Generated by the auto-merge-weekly workflow_\n' "$MARKER" "$1" | gh pr comment "$PR" --body-file -
            fi
            skip "$1"
          }

          if [ -n "${DISPATCH_PR:-}" ]; then
            PR="$DISPATCH_PR"
          else
            PR=$(gh pr list --state open --base main --head "$RUN_BRANCH" --json number --jq '.[0].number // empty')
            [ -n "$PR" ] || skip "no open PR into main for branch $RUN_BRANCH"
          fi

          gh pr view "$PR" --json number,title,author,isDraft,baseRefName,headRefName,headRefOid,isCrossRepository,labels,state > /tmp/pr.json
          jq . /tmp/pr.json
          TITLE=$(jq -r .title /tmp/pr.json)
          HEAD_SHA=$(jq -r .headRefOid /tmp/pr.json)

          [ "$(jq -r .state /tmp/pr.json)" = "OPEN" ] || skip "PR #$PR is not open"
          [ "$(jq -r .isCrossRepository /tmp/pr.json)" = "false" ] || skip "PR #$PR comes from a fork"
          [ "$(jq -r .baseRefName /tmp/pr.json)" = "main" ] || skip "PR #$PR does not target main"
          case "$(jq -r .headRefName /tmp/pr.json)" in claude/*) ;; *) skip "PR #$PR is not from a claude/ branch";; esac
          [ "$(jq -r .author.login /tmp/pr.json)" = "$OWNER" ] || skip "PR #$PR was not opened by $OWNER"
          [ "$(jq -r .isDraft /tmp/pr.json)" = "false" ] || skip "PR #$PR is a draft"
          if ! printf '%s' "$TITLE" | grep -qiE '^weekly hardening' && ! jq -e '.labels[] | select(.name == "auto-merge")' /tmp/pr.json >/dev/null; then
            skip "PR #$PR is not a weekly hardening PR (title or auto-merge label)"
          fi
          if [ -z "${DISPATCH_PR:-}" ] && [ "$HEAD_SHA" != "$RUN_SHA" ]; then
            skip "PR #$PR head moved to $HEAD_SHA after CI ran on $RUN_SHA; the next CI run decides"
          fi

          # Every check run on the head commit must have finished cleanly, CI included.
          gh api --paginate "repos/$GH_REPO/commits/$HEAD_SHA/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "none")] | @tsv' > /tmp/checks.tsv
          cat /tmp/checks.tsv
          [ -s /tmp/checks.tsv ] || skip "no check runs found on $HEAD_SHA"
          BAD=$(awk -F'\t' '$2 != "completed" || ($3 != "success" && $3 != "neutral" && $3 != "skipped")' /tmp/checks.tsv)
          [ -z "$BAD" ] || skip "checks not all green on $HEAD_SHA: $(printf '%s' "$BAD" | tr '\t\n' ' ;')"
          for job in "Type check + format check" "Route regression gate (durable demo contract)" "Conformance + coverage gate (critique/immutable-conformance lifecycle)"; do
            awk -F'\t' -v j="$job" '$1 == j && $3 == "success" {f=1} END {exit !f}' /tmp/checks.tsv || skip "required CI job '$job' did not succeed on $HEAD_SHA"
          done

          # Routine-owned paths only (CLAUDE.md invariant #8).
          gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[].filename' > /tmp/files.txt
          OUTSIDE=$(grep -vE '^(v[0-9]+/|reports/|_data/)|^(responsive-support|migrations|goals|route-bindings)\.json$' /tmp/files.txt || true)
          [ -z "$OUTSIDE" ] || explain "it changes files outside the routine's v<N>/ pages and shared ledgers: $(printf '%s' "$OUTSIDE" | head -20 | tr '\n' ' ')"

          gh pr merge "$PR" --merge --match-head-commit "$HEAD_SHA"
          echo "### Merged PR #$PR at $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          gh workflow run deploy.yml --ref main
          echo "Dispatched deploy.yml on main" >> "$GITHUB_STEP_SUMMARY"
