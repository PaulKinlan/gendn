<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root { --bg: #fdfcf8; --ink: #000000; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131210; --ink: #f4f1e8; }
    }
    .shadow { fill: var(--ink); }
    .card { fill: var(--bg); stroke: var(--ink); stroke-width: 2; }
    .glyph {
      fill: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
      font-weight: 700;
    }
  </style>
  <rect class="shadow" x="4" y="4" width="26" height="26"/>
  <rect class="card" x="2" y="2" width="26" height="26"/>
  <text class="glyph" x="15" y="20.5" text-anchor="middle">g</text>
</svg>
